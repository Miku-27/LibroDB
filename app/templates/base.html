<!DOCTYPE html>
<html lang="en" data-theme="Dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LibroDB{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/customStyle.css') }}">
</head>
<body class="bg-base text-text-main min-h-screen grid-bg">

    <div 
        x-data="toast"
        x-show="show"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0 -translate-y-4"
        x-transition:enter-end="opacity-100 translate-y-0"
        x-transition:leave="transition ease-in duration-200"
        class="fixed top-6 left-1/2 -translate-x-1/2 z-[100] w-full max-w-sm px-4"
        x-cloak>

        <div :class="colors[type]" 
             class="bg-surface border border-elevated border-l-4 p-4 shadow-2xl rounded-r-lg flex items-center gap-3">

            <template x-if="type === 'false'">
                <svg class="text-danger w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </template>
            <template x-if="type === 'true'">
                <svg class="text-accent w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </template>

            <p class="text-text-main text-sm font-medium" x-text="message"></p>

            <button @click="show = false" class="ml-auto text-text-dim hover:text-accent-hover">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-width="2"></path></svg>
            </button>
        </div>
    </div>

    {% block navbar %}
        {% include 'partials/navbar.html' %}
    {% endblock %}

    {% block layout %}
        <main class="max-w-7xl mx-auto px-6 py-10">
            {% block content %}{% endblock %}
        </main>
    {% endblock %}

    <!-- <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script> -->
    <script defer src="{{ url_for('static', filename='js/alpineCsp.js') }}"></script>
    <script src="{{ url_for('static', filename='js/base.js') }}"></script>
    {% block scripts %}{% endblock %}

</body>
</html>

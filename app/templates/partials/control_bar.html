<div class="w-full flex flex-col md:flex-row items-center gap-4 mb-8 bg-surface/70 backdrop-blur-md border border-elevated rounded-xl p-4 relative z-40">

    <div class="relative" @click.away="isCollectionDropdownOpen = false">
        <button 
            @click="isCollectionDropdownOpen = !isCollectionDropdownOpen" 
            class="flex items-center justify-between w-32 h-9 bg-elevated text-text-main rounded-md px-3 border border-border-strong hover:bg-border-strong focus:outline-none focus:ring-2 focus:ring-accent transition-colors"
        >
            <span class="truncate text-sm pr-1" x-text="collectionDropdownSelectedItem"></span>
            <svg xmlns="http://www.w3.org/2000/svg" 
                 class="w-4 h-4 flex-shrink-0 transition-transform duration-200" 
                 :class="open ? 'rotate-180' : ''"
                 fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
        </button>
    
        <div 
            x-show="isCollectionDropdownOpen"
            x-transition:enter="transition ease-out duration-100"
            x-transition:enter-start="opacity-0 scale-95"
            x-transition:enter-end="opacity-100 scale-100"
            class="absolute left-0 mt-2 w-40 bg-elevated border border-border-strong rounded-md shadow-lg z-50"
            style="display: none;"
        >
            <button 
                @click="collectionDropdownSelectedItem = 'Library';selectedCollectionId=null; isCollectionDropdownOpen = false;filters.collectionId=null "
                class="w-full text-left px-3 py-2 hover:bg-border-strong text-sm text-text-main truncate block">Library
            </button>
            <template x-for="item in collections.slice(0,4)" :key="item.collection_id">
                <!-- getBooks({collectionId : item.collection_id}) -->
                <button 
                    @click="collectionDropdownSelectedItem = item.collection_name;selectedCollectionId=item.collection_id; isCollectionDropdownOpen = false; filters.collectionId=item.collection_id " 
                    class="w-full text-left px-3 py-2 hover:bg-border-strong text-sm text-text-main truncate block"
                    x-text="item.collection_name">
                </button>
            </template>

            <div class="border-t border-border-strong my-1"></div>
            <button @click="openCollections()" class="w-full text-left px-3 py-2 hover:bg-border-strong text-sm font-medium text-accent">
                More
            </button>
        </div>
    </div>

    <!-- <button class="px-4 py-1.5 bg-accent-hover text-base rounded-md hover:bg-accent transition">
        New
    </button> -->

    <div class="flex-1 flex gap-2 w-full">
        <input 
            x-model="filters.title"
            type="text" 
            id="searchInput" 
            placeholder="Search books..."
            class="flex-1 w-full h-9 bg-elevated text-text-main rounded-md px-3 border border-border-strong focus:outline-none focus:ring-2 focus:ring-accent text-sm placeholder:text-text-dim" 
        />
        <button 
            id="searchBtn" 
            class="flex items-center h-9 bg-accent-hover text-base rounded-md px-3 border border-accent hover:bg-accent transition text-sm font-medium"
            @click="getBooks(filters)">
            Search
        </button>
    </div>

    <!-- new filer -->
    <div class="relative" @click.away="isFilterDropdownOpen = false; showLanguagesDropdown = false">
   
        <button 
            @click="isFilterDropdownOpen = !isFilterDropdownOpen" 
            class="flex items-center gap-2 h-9 bg-elevated text-text-main rounded-md px-3 border border-border-strong hover:bg-border-strong focus:outline-none focus:ring-2 focus:ring-accent transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" :class="(filters.status || filters.lang || filters.pages) ? 'text-accent' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2a1 1 0 01-.293.707L15 13.414V19a1 1 0 01-2 0v-5.586L3.293 6.707A1 1 0 013 6V4z" />
            </svg>
            <span class="hidden md:inline text-sm">Filter</span>
        </button>
    
        <div 
            x-show="isFilterDropdownOpen"
            x-transition:enter="transition ease-out duration-100"
            x-transition:enter-start="opacity-0 scale-95"
            x-transition:enter-end="opacity-100 scale-100"
            class="absolute right-0 mt-2 w-48 bg-elevated border border-border-strong rounded-md shadow-lg z-50"
            style="display: none;">

            <div class="px-3 py-2 text-[10px] text-text-dim font-bold uppercase tracking-wider">Status</div>

            <template x-for="s in ['Reading', 'Completed', 'Pending']">
                <button 
                    @click="filters.status = (filters.status === s ? null : s)"
                    class="w-full text-left px-3 py-2 hover:bg-border-strong text-sm text-text-main flex items-center justify-between"
                    :class="filters.status === s ? 'text-accent bg-accent/10' : ''">
                    <span x-text="s"></span>
                    <span x-show="filters.status === s" class="w-1.5 h-1.5 bg-accent rounded-full"></span>
                </button>
            </template>

            <div class="border-t border-border-strong my-1"></div>

            <div class="relative">
                <button 
                    @mouseenter="showLanguagesDropdown = true" 
                    @click="showLanguagesDropdown = !showLanguagesDropdown"
                    class="w-full text-left px-3 py-2 hover:bg-border-strong text-sm flex items-center justify-between transition-colors"
                    :class="filters.lang ? 'text-accent' : ''">
                    <span x-text="filters.language ? 'Lang: ' + filters.language : 'Language'"></span>
                    <svg class="w-3 h-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
                </button>
            
                <div x-show="showLanguagesDropdown" 
                     @mouseleave="showLanguagesDropdown = false"
                     class="absolute right-full top-0 mr-1 w-32 bg-elevated border border-border-strong rounded-md shadow-xl py-1">
                    <template x-for="l in ['En', 'Sp', 'Hi','Any']" >
                        <button @click="filters.language = l; showLanguagesDropdown = false"
                                class="w-full text-left px-3 py-1.5 hover:bg-border-strong text-sm text-text-main"
                                x-text="l"></button>
                    </template>
                </div>
            </div>
        
            <div class="border-t border-border-strong my-1"></div>
        
            <div class="px-3 py-2 text-[10px] text-text-dim font-bold uppercase tracking-wider">Page Count less than</div>
            <template x-for="p in ['200', '300', '500']">
                <button 
                    @click="filters.page_count_lt = (filters.page_count_lt === p ? null : p)"
                    class="w-full text-left px-3 py-2 hover:bg-border-strong text-sm flex items-center justify-between"
                    :class="filters.page_count_lt === p ? 'text-accent bg-accent/10' : ''">
                    <span x-text="p"></span>
                    <span x-show="filters.page_count_lt === p" class="w-1.5 h-1.5 bg-accent rounded-full"></span>
                </button>
            </template>

            <div class="border-t border-border-strong my-1"></div>

            <button 
                @click="filters = {status:null, language:null, page_count_lt:null}; isFilterDropdownOpen = false"
                class="w-full text-left px-3 py-2 hover:bg-border-strong text-sm text-danger font-medium">
                Clear All
            </button>
        </div>
    </div>
</div>

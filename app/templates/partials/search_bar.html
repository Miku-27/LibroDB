<div class="mb-8">
    <div class="w-full flex items-center gap-4 bg-surface/70 backdrop-blur-md border border-elevated rounded-xl p-4">
        <div class="flex-1 flex gap-2">
            <input
                x-model="query"
                type="text"
                id="searchInput"
                @keyup.enter="searchBooks()"
                placeholder="Search books..."
                class="flex-1 h-9 bg-elevated text-text-main rounded-md px-3 border border-border-strong
                       focus:outline-none focus:ring-2 focus:ring-accent text-sm placeholder:text-text-dim"
            />
            <button
                id="searchBtn"
                @click="searchBooks()"
                class="h-9 px-4 bg-accent-hover text-base rounded-md
                       border border-accent hover:bg-accent transition text-sm font-bold shadow-lg">
                Search
            </button>
        </div>
    </div>
</div>
